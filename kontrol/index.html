<style>
  :root{ --bg:#ffffff; --text:#1d1d1f; --sub:#86868b; --accent:#0a6cff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{ width:100%; max-width:420px; padding:24px; text-align:center; }
  .icon{
    width:76px; height:76px; margin:0 auto 20px; border-radius:20px;
    background:var(--text); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:42px; font-weight:700;
  }
  h1{ font-size:24px; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px; }
  p{ font-size:15px; color:var(--sub); margin:0; }
  .btn{
    display:inline-block; margin-top:28px; padding:14px 30px;
    background:var(--accent); color:#fff; text-decoration:none;
    font-size:16px; font-weight:600; border-radius:100px;
  }
  .btn:active{ opacity:.85; }
</style>
