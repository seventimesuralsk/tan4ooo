<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Скидка активирована</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#1d1d1f;
    --sub:#86868b;
    --accent:#34c759;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
      "Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{ width:100%; max-width:420px; padding:24px; text-align:center; }
  .checkmark{
    width:64px; height:64px;
    margin:0 auto 32px;
    border-radius:50%;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    animation:pop .5s .1s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes pop{
    0%{transform:scale(0); opacity:0;}
    60%{transform:scale(1.08);}
    100%{transform:scale(1); opacity:1;}
  }
  .checkmark svg{ width:28px; height:28px; }
  .checkmark path{
    stroke:#fff; stroke-width:2.5; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:40; stroke-dashoffset:40;
    animation:draw .4s .4s ease-out forwards;
  }
  @keyframes draw{ to{stroke-dashoffset:0;} }
  .percent{
    font-size:40px; font-weight:300; letter-spacing:-0.02em;
    margin:0 0 6px;
    opacity:0; animation:fadeUp .5s .45s ease-out forwards;
  }
  h1{
    font-size:20px; font-weight:400; letter-spacing:-0.01em;
    margin:0; line-height:1.3; color:var(--text);
    opacity:0; animation:fadeUp .5s .55s ease-out forwards;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hint{
    font-size:13px; font-weight:400; color:var(--sub);
    margin-top:48px;
    opacity:0; animation:fadeUp .5s .7s ease-out forwards;
  }
  .close-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:var(--text);
    color:#fff;
    font-size:15px; font-weight:500;
    text-decoration:none;
    border-radius:100px;
    opacity:0; animation:fadeUp .5s .85s ease-out forwards;
    transition:transform .15s ease, opacity .15s ease;
  }
  .close-btn:active{ transform:scale(0.96); opacity:.85; }
</style>
</head>
<body>
<div class="wrap">
  <div class="checkmark">
    <svg viewBox="0 0 24 24"><path d="M4 12.5L9.5 18L20 6.5"/></svg>
  </div>
  <div class="percent">−15%</div>
  <h1>Скидка активирована</h1>
  <div class="hint">Покажите этот экран баристу или официанту</div>
  <a href="https://seventimesuralsk.github.io/seventimes/" class="close-btn">Закрыть</a>
</div>

<script>
  // Отправка события активации в Google Apps Script (Web App).
  // ВАЖНО: этот fetch сработает ТОЛЬКО если страница хостится вне claude.ai
  // (свой домен/хостинг). На claude.ai artifact его заблокирует CSP платформы —
  // запрос просто не уйдёт, ошибки в консоли не увидишь, тихий фейл.
  (function(){
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwD6-8OGeNBxEGdqVaAifl4SxVuZDk7NLV0D6zmj3gH9Pwv8qVtPjiKaZSwYLCHZXbM/exec";
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script не даёт CORS-заголовков, читаем ответ вслепую
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        date: new Date().toISOString().slice(0,10),
        time: new Date().toISOString()
      })
    }).catch(function(){ /* тихо игнорируем сетевые ошибки */ });
  })();
</script>
</body>
</html>
